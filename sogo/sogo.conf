/* ============================================================================
 *  SOGo — шаблон /etc/sogo/sogo.conf. Плейсхолдеры @...@ подставляет install/render.py,
 *  блок источников пользователей (@SOGO_USER_SOURCES@) собирается там же: локальные ящики из
 *  представления v_sogo_users базы mail и, если настроен AD, учётки из Active Directory.
 *  SOGo — обычный клиент почты: IMAP 143 и submission 587 на localhost с паролем пользователя.
 *  Автоответ, пересылка и фильтры здесь выключены: ими управляет панель (личный кабинет /me) через Sieve.
 * ============================================================================ */
{
  /* ---- своя база SOGo (профили, календари, адресные книги, сессии) ---- */
  SOGoProfileURL = "postgresql://sogo:@DB_SOGO_PASSWORD@@127.0.0.1:5432/sogo/sogo_user_profile";
  OCSFolderInfoURL = "postgresql://sogo:@DB_SOGO_PASSWORD@@127.0.0.1:5432/sogo/sogo_folder_info";
  OCSSessionsFolderURL = "postgresql://sogo:@DB_SOGO_PASSWORD@@127.0.0.1:5432/sogo/sogo_sessions_folder";
  OCSEMailAlarmsFolderURL = "postgresql://sogo:@DB_SOGO_PASSWORD@@127.0.0.1:5432/sogo/sogo_alarms_folder";
  OCSStoreURL = "postgresql://sogo:@DB_SOGO_PASSWORD@@127.0.0.1:5432/sogo/sogo_store";
  OCSAclURL = "postgresql://sogo:@DB_SOGO_PASSWORD@@127.0.0.1:5432/sogo/sogo_acl";
  OCSCacheFolderURL = "postgresql://sogo:@DB_SOGO_PASSWORD@@127.0.0.1:5432/sogo/sogo_cache_folder";
  SOGoMemcachedHost = "127.0.0.1";

  /* ---- пользователи ---- */
  SOGoUserSources = (
@SOGO_USER_SOURCES@
  );
  SOGoForceExternalLoginWithEmail = YES;
  SOGoPasswordChangeEnabled = NO;              /* пароль меняется в личном кабинете панели или в AD */
  SOGoMailAuxiliaryUserAccountsEnabled = NO;
  SOGoEnablePublicAccess = NO;

  /* ---- почта: Dovecot и Postfix этого же хоста ---- */
  SOGoIMAPServer = "imap://127.0.0.1:143";     /* слушатель только на loopback, Dovecot считает его защищённым */
  SOGoMailingMechanism = smtp;
  SOGoSMTPServer = "smtp://127.0.0.1:587/?tls=YES&tlsVerifyMode=allowInsecureLocalhost";
  SOGoSMTPAuthenticationType = PLAIN;          /* от имени пользователя: Postfix проверяет, что адрес его */
  SOGoMailDomain = "@SOGO_MAIL_DOMAIN@";
  SOGoSieveServer = "sieve://127.0.0.1:4190";
  SOGoSieveScriptsEnabled = NO;
  SOGoVacationEnabled = NO;
  SOGoForwardEnabled = NO;
  SOGoMailMessageCheck = every_minute;
  SOGoRefreshViewCheck = every_minute;
  SOGoMailSpoolPath = /var/spool/sogo;

  /* ---- календарь и контакты ---- */
  SOGoCalendarDefaultRoles = (PublicDAndTViewer);   /* коллеги видят занятость (даты и время), не содержание */
  SOGoAppointmentSendEMailNotifications = YES;
  SOGoACLsSendEMailNotifications = YES;
  SOGoFoldersSendEMailNotifications = YES;
  SOGoEnableEMailAlarms = YES;
  SOGoTimeZone = "@SOGO_TIMEZONE@";
  SOGoLanguage = Russian;
  SOGoFirstDayOfWeek = 1;
  SOGoTimeFormat = "%H:%M";
  SOGoLongDateFormat = "%d.%m.%Y";
  SOGoShortDateFormat = "%d.%m.%Y";

  /* ---- ActiveSync (sogo-activesync): длинные push-соединения ---- */
  SOGoMaximumPingInterval = 3540;
  SOGoMaximumSyncInterval = 3540;
  SOGoInternalSyncInterval = 60;

  /* ---- процесс ---- */
  WOWorkersCount = @SOGO_WORKERS@;
  WOWatchDogRequestTimeout = 60;
  WOListenQueueSize = 20;
  SxVMemLimit = 512;
  SOGoXSRFValidationEnabled = YES;
  SOGoTrustProxyAuthentication = NO;
  SOGoMaximumFailedLoginCount = 5;             /* после 5 неудач — пауза на SOGoFailedLoginBlockInterval секунд */
  SOGoMaximumFailedLoginInterval = 60;
  SOGoFailedLoginBlockInterval = 300;
}
