# Белые и чёрные списки, которые правятся из панели (раздел «Фильтр»). Файлы карт лежат в /var/lib/rspamd/maps,
# принадлежат _rspamd — контроллер Rspamd сохраняет их по запросу панели (/savemap), бэкенд на хост не ходит.
# Отправитель: адрес целиком или домен. IP: адрес или сеть CIDR. Строки с # — комментарии.

WHITELIST_SENDER {
  type = "from";
  map = "/var/lib/rspamd/maps/whitelist_from.map";
  description = "Белый список отправителей (панель)";
  score = -10.0;
}

BLACKLIST_SENDER {
  type = "from";
  map = "/var/lib/rspamd/maps/blacklist_from.map";
  description = "Чёрный список отправителей (панель)";
  score = 15.0;
}

WHITELIST_IP {
  type = "ip";
  map = "/var/lib/rspamd/maps/whitelist_ip.map";
  description = "Белый список IP (панель)";
  score = -10.0;
}

BLACKLIST_IP {
  type = "ip";
  map = "/var/lib/rspamd/maps/blacklist_ip.map";
  description = "Чёрный список IP (панель)";
  score = 15.0;
}
