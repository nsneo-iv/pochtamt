# Лимит исходящих писем на аутентифицированного пользователя: взломанный ящик не должен быть рассыльщиком спама.
# Превышение — временный отказ (повтор позже). Значение подобрано с запасом для обычных рассылок организации.
rates {
  user {
    bucket {
      burst = 500;
      rate = "500 / 1h";
    }
  }
}
