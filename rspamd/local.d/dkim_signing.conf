# Подпись DKIM исходящих писем. Ключи лежат в Redis, их туда кладёт бэкенд (backend/app/services/dkim.py):
#   HSET DKIM_PRIVATE_KEYS <selector>.<domain> <PEM>
#   HSET DKIM_SELECTORS    <domain> <selector>
enabled = true;
use_redis = true;
key_prefix = "DKIM_PRIVATE_KEYS";
selector_prefix = "DKIM_SELECTORS";
sign_authenticated = true;
sign_local = true;
sign_networks = ["127.0.0.0/8"];
use_domain = "header";
allow_hdrfrom_mismatch = false;
allow_username_mismatch = true;
# при use_redis нужен try_fallback: иначе модуль считает домен «ненастроенным» и не идёт в Redis
# (селектор и ключ всё равно берутся из Redis; домен без ключа в Redis просто не подписывается)
try_fallback = true;
use_esld = false;
