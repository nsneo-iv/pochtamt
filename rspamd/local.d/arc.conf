# ARC-подпись теми же ключами, что DKIM (нужна при пересылке через алиасы и рассылки)
enabled = true;
use_redis = true;
key_prefix = "DKIM_PRIVATE_KEYS";
selector_prefix = "DKIM_SELECTORS";
sign_authenticated = true;
sign_local = true;
use_domain = "header";
allow_username_mismatch = true;
# при use_redis нужен try_fallback: иначе модуль считает домен «ненастроенным» и не идёт в Redis
# (селектор и ключ всё равно берутся из Redis; домен без ключа в Redis просто не подписывается)
try_fallback = true;
