# Антивирус: ClamAV через unix-сокет clamd. Найденный вирус — символ CLAMAV и action = reject
# (письмо отбивается на SMTP с кодом 5xx независимо от баллов). Части письма больше max_size не сканируются.
clamav {
  type = "clamav";
  servers = "/run/clamav/clamd.ctl";
  action = "reject";
  message = "${SCANNER}: virus found: \"${VIRUS}\"";
  max_size = 52428800;
  timeout = 60.0;
  retransmits = 2;
  log_clean = true;
  scan_mime_parts = true;
  scan_text_mime = false;
  scan_image_mime = false;
  # обход по чистым письмам: кэш результата в Redis, чтобы не сканировать одно и то же
  cache_expire = 3600;
}
