# Баны по логам Postfix и Dovecot. Свои сети (LAN_NETS) не баним: оттуда ходит и веб-почта.
[DEFAULT]
ignoreip = 127.0.0.1/8 @LAN_NETS_SPACE@
bantime = 1h
findtime = 10m
maxretry = 5
banaction = nftables-multiport

[postfix]
enabled = true
mode = aggressive
logpath = /var/log/postfix.log

[postfix-sasl]
enabled = true
logpath = /var/log/postfix.log

[dovecot]
enabled = true
logpath = /var/log/dovecot.log
