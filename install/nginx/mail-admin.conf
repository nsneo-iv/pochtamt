# Панель администрирования: только из разрешённых сетей, TLS прямо на хосте, наружу не публикуется.
# Вход (админ и кабинет) — не чаще 10 попыток в минуту с одного адреса: каждая попытка — bind в AD,
# а перебор пароля иначе блокирует учётку в AD (политика lockout).
limit_req_zone $binary_remote_addr zone=mail_login:10m rate=10r/m;
limit_req_status 429;

server {
    # default_server: пока нет DNS-имени, панель открывается и по https://<ip>/
    listen 443 ssl default_server;
    http2 on;
    server_name @ADMIN_HOSTNAME@;

    ssl_certificate     @TLS_CERT@;
    ssl_certificate_key @TLS_KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;

    # доступ только из LAN/VPN (ADMIN_ALLOW_NETS в install/.env)
    @ADMIN_ALLOW_RULES@
    deny all;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    root /opt/mail/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api/v1/(auth|me)/login$ {
        limit_req zone=mail_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 4k;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }

    # веб-интерфейс Rspamd (свой пароль, RSPAMD_PASSWORD)
    location /rspamd/ {
        proxy_pass http://127.0.0.1:11334/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

server {
    listen 80 default_server;
    server_name @MAIL_HOSTNAME@ @ADMIN_HOSTNAME@;
    # HTTP-01 проверка certbot (install.sh, CERTBOT_EMAIL); всё остальное — на https
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
