# SOGo (календарь, контакты, веб-почта, ActiveSync): публикуется наружу на своём имени, TLS на хосте.
# sogod работает в контейнере в сети хоста и слушает 127.0.0.1:20000; статика — /var/lib/sogo/www.
server {
    listen 443 ssl;
    http2 on;
    server_name @SOGO_HOSTNAME@;

    ssl_certificate     @TLS_CERT@;
    ssl_certificate_key @TLS_KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;

    root /var/lib/sogo/www;
    client_max_body_size 50m;

    location = / {
        return 302 /SOGo/;
    }
    # автонастройка клиентов CalDAV/CardDAV (Apple, DAVx5, Thunderbird)
    location = /.well-known/caldav  { return 301 https://$host/SOGo/dav/; }
    location = /.well-known/carddav { return 301 https://$host/SOGo/dav/; }
    # Let's Encrypt продлевает по https-vhost'у тоже (certbot --webroot)
    location /.well-known/acme-challenge/ { root /var/www/acme; }

    # статика интерфейса — с диска, минуя sogod
    location /SOGo.woa/WebServerResources/ {
        alias /var/lib/sogo/www/;
        expires max;
    }
    location /SOGo/WebServerResources/ {
        alias /var/lib/sogo/www/;
        expires max;
    }

    # ActiveSync: длинные push-соединения (до часа), без буферизации
    location ^~ /Microsoft-Server-ActiveSync {
        proxy_pass http://127.0.0.1:20000/SOGo/Microsoft-Server-ActiveSync;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-webobjects-server-protocol HTTP/1.0;
        proxy_set_header x-webobjects-remote-host $remote_addr;
        proxy_set_header x-webobjects-server-name $server_name;
        proxy_set_header x-webobjects-server-url $scheme://$host;
        proxy_set_header x-webobjects-server-port $server_port;
        proxy_connect_timeout 75;
        proxy_send_timeout 3600;
        proxy_read_timeout 3600;
        proxy_buffering off;
    }

    # веб-интерфейс, CalDAV/CardDAV (/SOGo/dav/), API
    location ^~ /SOGo {
        proxy_pass http://127.0.0.1:20000;
        proxy_http_version 1.1;
        proxy_redirect http://$host https://$host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header x-webobjects-server-protocol HTTP/1.0;
        proxy_set_header x-webobjects-remote-host $remote_addr;
        proxy_set_header x-webobjects-server-name $server_name;
        proxy_set_header x-webobjects-server-url $scheme://$host;
        proxy_set_header x-webobjects-server-port $server_port;
        proxy_connect_timeout 75;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 64k;
    }
}
