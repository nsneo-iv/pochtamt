#!/usr/sbin/nft -f
# Файрвол почтового хоста. Снаружи открыты только почтовые порты и 80 (ACME-проверка certbot и редирект на https);
# панель (443), ManageSieve и SSH — только из своих сетей (LAN_NETS). Правила fail2ban живут в своей таблице.
flush ruleset

table inet filter {
    set lan {
        type ipv4_addr
        flags interval
        elements = { @LAN_NETS_NFT@ }
    }

    chain input {
        type filter hook input priority 0; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif lo accept
        ip protocol icmp accept

        # почта: приём и клиенты
        tcp dport { 25, 465, 587, 993 } accept
        # ManageSieve — только из LAN
        tcp dport 4190 ip saddr @lan accept
        # 80 — только ACME-проверка и редирект на https; панель (443) — из своих сетей
        tcp dport 80 accept
        tcp dport 443 ip saddr @lan accept
        # SSH и агент мониторинга (Zabbix) — из своих сетей
        tcp dport { 22, 10050 } ip saddr @lan accept
    }

    chain forward { type filter hook forward priority 0; policy drop; }
    chain output  { type filter hook output  priority 0; policy accept; }
}
