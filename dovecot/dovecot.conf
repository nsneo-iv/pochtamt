# ============================================================================
#  Dovecot 2.4 (Debian 13) — шаблон. Плейсхолдеры @...@ подставляет install/render.py.
#  Пользователи и квоты — из PostgreSQL (представления v_dovecot_*), пароли local — там же,
#  пароли ad — проверка bind'ом в Active Directory (блок passdb ldap подставляется, если AD настроен).
#  ВНИМАНИЕ: синтаксис 2.4 отличается от 2.3; после правок всегда `doveconf -n` и `doveadm auth test`.
# ============================================================================

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap lmtp sieve
listen = *
log_path = /var/log/dovecot.log
auth_verbose = yes
auth_verbose_passwords = no

# ---------------------------------------------------------------- TLS -------
ssl = required
ssl_server_cert_file = @TLS_CERT@
ssl_server_key_file = @TLS_KEY@
ssl_min_protocol = TLSv1.2
ssl_cipher_list = ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!MD5

# ---------------------------------------------------------------- хранилище ----
mail_driver = maildir
mail_home = /var/vmail/%{user | domain}/%{user | username}
mail_path = ~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
mail_plugins {
  quota = yes
}
# SMTPUTF8 в LMTP: иначе Postfix отбивает письма с не-ASCII адресами/заголовками без MIME-кодирования
mail_utf8_extensions = yes

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Archive {
    auto = create
    special_use = \Archive
  }
}

# ---------------------------------------------------------------- квоты ----
# размер приходит из userdb (поле quota_storage_size, берётся из mailboxes.quota_mb); 0 = без ограничения.
# Жёсткий storage_size здесь ставить нельзя: он перекрывает значение из userdb и режет все ящики до одного размера
quota "User quota" {
}
quota_exceeded_message = Mailbox is full / Почтовый ящик переполнен

# ---------------------------------------------------------------- аутентификация ----
auth_mechanisms = plain login
auth_username_format = %{user | lower}
auth_cache_size = 10M
auth_cache_ttl = 10 mins
auth_cache_negative_ttl = 1 min

sql_driver = pgsql
pgsql main {
  parameters {
    host = 127.0.0.1
    dbname = mail
    user = mail_dovecot
    password = @DB_DOVECOT_PASSWORD@
  }
}

# 0) master-пользователь панели: логин «ящик*panel» с паролем из /etc/dovecot/master-users —
#    так бэкенд заливает Sieve-скрипты пользователей через ManageSieve, не зная их паролей
auth_master_user_separator = *
passdb passwd-file {
  master = yes
  passwd_file_path = /etc/dovecot/master-users
  result_success = continue
}

# 1) база решает, КАК проверять пароль ящика:
#    - auth = local: хеш из базы; неверный пароль — отказ (в AD не проваливаемся: иначе пароль доменной учётки с
#      тем же именем открывал бы чужой локальный ящик);
#    - auth = ad: noauthenticate — этот passdb пароль не проверяет, решение за passdb ldap ниже;
#    - ящика нет в базе: отказ (return-fail) — в AD такой логин не пускаем.
passdb sql {
  query = SELECT password, CASE WHEN auth = 'local' THEN NULL ELSE 'y' END AS noauthenticate FROM v_dovecot_auth WHERE username = '%{user}'
  result_failure = return-fail
}

@DOVECOT_PASSDB_LDAP@

# userdb один для обоих способов: ящик обязан существовать в базе, иначе входа нет
userdb sql {
  query = SELECT '/var/vmail/' || domain || '/' || local_part AS home, \
                 quota_bytes AS quota_storage_size \
            FROM v_dovecot_users WHERE username = '%{user}'
  # перечисление пользователей для doveadm -A (квоты для панели)
  iterate_query = SELECT username FROM v_dovecot_users
}

# ---------------------------------------------------------------- службы ----
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  process_min_avail = 2
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
}

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

# ---------------------------------------------------------------- Sieve ----
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}
protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}
sieve_script personal {
  path = ~/sieve
}
# глобальный скрипт (выполняется до пользовательских): письма, помеченные Rspamd, кладём в Junk
sieve_script before {
  type = before
  path = /etc/dovecot/sieve/before.d/10-spam.sieve
}
# пользовательские скрипты (в том числе через веб-почту/ManageSieve) не должны превращать ящик в рассыльщик
sieve_max_redirects = 4
sieve_max_actions = 32

# ---------------------------------------------------------------- защита от перебора ----
# Повторные неудачные входы тормозятся самим Dovecot; fail2ban читает /var/log/dovecot.log (install/fail2ban/)
auth_failure_delay = 2 secs
mail_max_userip_connections = 20

# ---------------------------------------------------------------- параметры из панели ----
# агент на хосте пишет сюда ключи из белого списка (настройки сервера в панели); файла может не быть
!include_try /etc/dovecot/panel.conf
